[project]
name = "apt-daily"
version = "0.1.0"
description = "Nationwide Apartment Real Estate Sales & Rent 7-Day Monitoring Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
