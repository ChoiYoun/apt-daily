name: Daily Real Estate Data Collector

on:
  schedule:
    # 매일 UTC 21:00 (한국 시간 오전 06:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 즉시 실행 지원

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync

      - name: Verify Secret Availability
        env:
          KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::DATA_GO_KR_API_KEY Secret이 설정되지 않았습니다! GitHub 저장소 Settings -> Secrets and variables -> Actions에서 DATA_GO_KR_API_KEY를 추가해 주세요."
            exit 1
          fi
          echo "✅ DATA_GO_KR_API_KEY Secret이 정상 주입되었습니다."

      - name: Run Collector
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python src/collector.py

      - name: Commit and Push DB Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/real_estate.db data/meta.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-update recent 7 days real estate data [skip ci]" && git push)
